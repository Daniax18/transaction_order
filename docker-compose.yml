version: '3.9'

services:
  # Gateway service
  gateway-service:
    build: ./src/api-gateway
    container_name: gateway-service
    ports:
      - "8080:8080"
    networks:
      - transaction-network

  # Rabbit mq
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s 
    networks:
      - transaction-network

  # User Service
  user-db:
    image: postgres:15
    container_name: user-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_db
    ports:
      - "5433:5432"
    volumes:
      - user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - transaction-network

  auth-service:
    build: ./src/services/AuthService
    container_name: auth-service
    ports:
      - "5001:8081"
    environment:
      ConnectionStrings__UserDb: "Host=user-db;Port=5432;Database=user_db;Username=postgres;Password=postgres"
      ASPNETCORE_URLS: "http://+:8081"
      RABBITMQ_HOST: rabbitmq
    depends_on:
      user-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - transaction-network

  # Log Service
  log-service:
    build: ./src/services/AuditService
    container_name: log-service
    ports:
      - "5002:8081"
    environment:
      ASPNETCORE_URLS: "http://+:8081"
      RABBITMQ_HOST: rabbitmq
    volumes:
      - ./logs:/app/logs
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    networks:
      - transaction-network

  # Frontend (Next.js)
  frontend:
    build: ./src/frontend
    container_name: frontend
    ports:
      - "3000:3000"
    networks:
      - transaction-network

networks:
  transaction-network:
    driver: bridge

volumes:
  user_data:
